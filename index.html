<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grok每日報告 | Daily Portfolio Signal</title>
<style>
:root{--bg:#0b0f14;--card:#1a2234;--border:#2a3548;--text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;--accent:#14b8a6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--reds:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,Noto Sans TC,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.top-nav{display:flex;gap:8px;padding:16px 24px;overflow-x:auto;border-bottom:1px solid var(--border);background:#111827}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:500;border:none;cursor:pointer;background:#1e293b;color:var(--muted);white-space:nowrap}
.nav-btn.active,.nav-btn.update-btn{background:var(--accent);color:#0f172a;font-weight:600}
.nav-btn.update-btn{margin-left:auto}
.container{max-width:1100px;margin:0 auto;padding:20px 24px 60px}
.update-time{font-size:12px;color:var(--dim);margin-bottom:16px}
.section-label{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.main-title{font-size:28px;font-weight:700;margin-bottom:4px}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:24px}
.index-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.index-card,.us-card,.light-card,.summary-card,.holding-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.index-card .label,.us-card .label,.summary-card .label,.light-card .label{font-size:13px;color:var(--muted);margin-bottom:6px}
.index-card .value{font-size:28px;font-weight:700;margin-bottom:4px}
.change.down,.holding-change.down{color:var(--green)}
.change.up,.holding-change.up{color:var(--reds)}
.holding-change{color:inherit}
.us-markets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.us-card{padding:14px 16px;border-radius:8px}
.us-card .value{font-size:18px;font-weight:600}
.light-stats,.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.light-card{text-align:center}
.light-card .number{font-size:36px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.summary-card .value{font-size:24px;font-weight:700;margin-bottom:4px}
.summary-card .value.negative{color:var(--green)}
.summary-card .value.positive{color:var(--reds)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.5)}
.dot.yellow{background:var(--yellow);box-shadow:0 0 8px rgba(234,179,8,.5)}
.dot.red{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,.5)}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9999px;font-size:13px;font-weight:500;border:none;cursor:pointer;background:#1e293b;color:var(--muted)}
.filter-btn.active{background:var(--accent);color:#0f172a;font-weight:600}
.holdings-list{display:flex;flex-direction:column;gap:8px}
.holding-item{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer}
.holding-left{display:flex;align-items:center;gap:12px}
.holding-bar{width:4px;height:36px;border-radius:2px}
.holding-bar.green{background:var(--green)}.holding-bar.yellow{background:var(--yellow)}.holding-bar.red{background:var(--red)}
.holding-info .name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.holding-info .name .tag{font-size:11px;color:var(--dim);background:#1e293b;padding:1px 6px;border-radius:4px}
.holding-info .meta{font-size:12px;color:var(--dim);margin-top:2px}
.holding-right{display:flex;align-items:center;gap:16px;text-align:right}
.holding-price{font-size:16px;font-weight:600}
.holding-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:600}
.holding-badge.green{background:rgba(34,197,94,.15);color:var(--green)}
.holding-badge.yellow{background:rgba(234,179,8,.15);color:var(--yellow)}
.holding-badge.red{background:rgba(239,68,68,.15);color:var(--red)}
.arrow{color:var(--dim)}
.mr-section{margin-bottom:32px}
.mr-section-title{font-size:18px;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.mr-sub{font-size:14px;font-weight:600;color:var(--muted);margin:16px 0 8px}
.mr-stats-row{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 16px;font-size:13px;color:var(--muted)}
.mr-stat strong{color:var(--text);margin-left:4px}
.mr-stat .up{color:var(--reds)}.mr-stat .down{color:var(--green)}
.mr-sectors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.mr-sector-col{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.mr-sector-head{font-size:12px;font-weight:600;margin-bottom:10px;color:var(--muted)}
.mr-sector-head.gain{color:var(--reds)}.mr-sector-head.loss{color:var(--green)}
.mr-sector-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.mr-sector-row .up{color:var(--reds)}.mr-sector-row .down{color:var(--green)}
.mr-table-wrap{overflow-x:auto;margin-bottom:12px}
.mr-table{width:100%;border-collapse:collapse;font-size:13px}
.mr-table th,.mr-table td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--border)}
.mr-table th:first-child,.mr-table td:first-child{text-align:left}
.mr-table th{color:var(--muted);font-weight:500;font-size:12px}
.mr-table .up{color:var(--reds)}.mr-table .down{color:var(--green)}
.mr-note{font-size:12px;color:var(--dim);line-height:1.6;margin-top:8px}
.news-list{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.news-item{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit}
.news-item.good .news-title{color:var(--reds)}
.news-item.bad .news-title{color:var(--green)}
.news-item.neutral .news-title{color:var(--text)}
.news-title{font-size:17px;font-weight:650;line-height:1.55}
.news-en{font-size:14px;line-height:1.5;margin-top:6px;color:var(--muted);font-weight:400}
.news-item.good .news-en{color:rgba(248,113,113,.85)}
.news-item.bad .news-en{color:rgba(34,197,94,.8)}
.news-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--dim)}
.news-tag{background:#1e293b;padding:2px 8px;border-radius:999px;font-size:12px}
@media(max-width:768px){.news-title{font-size:16px}.news-en{font-size:14px}.news-item{padding:14px 12px}}
.mr-global{grid-template-columns:repeat(4,1fr)!important}
.mr-tech-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.mr-tech-col{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:120px}
.mr-tech-head{font-size:13px;font-weight:600;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.mr-tech-col.green .mr-tech-head{color:var(--green)}
.mr-tech-col.teal .mr-tech-head{color:var(--accent)}
.mr-tech-col.yellow .mr-tech-head{color:var(--yellow)}
.mr-tech-col.red .mr-tech-head{color:var(--red)}
.mr-tech-item{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--text)}
.mr-tech-item .score{color:var(--muted);font-variant-numeric:tabular-nums}
.mr-tech-group{margin-bottom:10px}
.mr-tech-industry{font-size:11px;font-weight:600;color:var(--accent);margin:8px 0 4px;padding-top:4px;border-top:1px solid var(--border)}
.mr-tech-group:first-child .mr-tech-industry{border-top:none;padding-top:0;margin-top:0}
@media(max-width:768px){.index-row,.us-markets,.light-stats,.summary-row{grid-template-columns:1fr}.us-markets{grid-template-columns:1fr 1fr}.holding-item{flex-direction:column;align-items:flex-start;gap:12px}.holding-right{width:100%;justify-content:space-between}.mr-sectors,.mr-tech-grid,.mr-global{grid-template-columns:1fr!important}}
.light-stats-wrap{margin-bottom:16px}
.signal-legend{margin-top:12px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-item strong{color:var(--text)}
.legend-hint{margin:6px 0 0;font-size:12px;color:var(--accent)}
.holding-item{flex-direction:column;align-items:stretch;gap:0;padding:0!important}
.holding-main{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;width:100%}
.holding-item.expanded{border-color:#3b4a63;background:#1f2a3d}
.arrow{transition:transform .2s;display:inline-block}
.arrow.open{transform:rotate(90deg);color:var(--accent)}
.holding-detail{border-top:1px solid var(--border);padding:14px 18px 16px;background:rgba(0,0,0,.25);font-size:13px}
.detail-row{margin-bottom:10px}
.detail-row.signal-reason .detail-value strong.green{color:var(--green)}
.detail-row.signal-reason .detail-value strong.yellow{color:var(--yellow)}
.detail-row.signal-reason .detail-value strong.red{color:var(--red)}
.detail-label{display:block;font-size:11px;color:var(--dim);margin-bottom:2px;text-transform:uppercase;letter-spacing:.03em}
.detail-value{color:var(--text);line-height:1.45}
.detail-value.muted{color:var(--muted);font-size:12px}
.detail-value.up{color:var(--reds)}
.detail-value.down{color:var(--green)}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;margin-top:4px}
@media(max-width:768px){.detail-grid{grid-template-columns:1fr 1fr}.holding-main{flex-direction:column;align-items:flex-start;gap:12px}.holding-right{width:100%;justify-content:space-between}}

/* ===== 真實 MA 計算區塊 ===== */
.ma-section{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border)}
.ma-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.ma-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center}
.ma-item.above{border-color:rgba(34,197,94,.35)}
.ma-item.below{border-color:rgba(239,68,68,.35)}
.ma-name{font-size:11px;color:var(--dim);letter-spacing:.04em;margin-bottom:4px}
.ma-value{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px}
.ma-status{font-size:12px;font-weight:600}
.ma-item.above .ma-status{color:var(--green)}
.ma-item.below .ma-status{color:var(--red)}
.ma-arrangement{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.ma-arr-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.ma-arr-badge.bull{background:rgba(34,197,94,.15);color:var(--green)}
.ma-arr-badge.bear{background:rgba(239,68,68,.15);color:var(--red)}
.ma-arr-badge.side{background:rgba(234,179,8,.12);color:var(--yellow)}
.detail-value.bias-bull{color:var(--green);font-weight:600}
.detail-value.bias-bear{color:var(--red);font-weight:600}
.detail-value.bias-side{color:var(--yellow);font-weight:600}
.signal-legend em{color:var(--accent);font-style:normal;font-weight:600}
.factor-list{list-style:none;margin:8px 0 14px;padding:10px 12px;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.factor-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.45}
.factor-dot{flex-shrink:0;margin-top:1px}
.factor-item.bias-bull{color:var(--green)}
.factor-item.bias-bear{color:var(--red)}
.factor-item.bias-side{color:var(--yellow)}
.factor-text{color:var(--text)}
.factor-item.bias-bull .factor-text{color:#86efac}
.factor-item.bias-bear .factor-text{color:#fca5a5}
.factor-item.bias-side .factor-text{color:#fde68a}
.inst-section{margin:12px 0 4px;padding-top:10px;border-top:1px dashed var(--border)}
.inst-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.inst-table{font-variant-numeric:tabular-nums}
.inst-table th,.inst-table td{text-align:right}
@media(max-width:768px){.inst-sum{grid-template-columns:1fr 1fr}}
.ma-advice{display:block;margin-top:4px;line-height:1.55;color:var(--text)}
@media(max-width:768px){.ma-grid{grid-template-columns:1fr}}

.update-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:min(92vw,520px);text-align:center}
.update-toast.err{border-color:var(--red);color:#fecaca}
.update-toast.ok{border-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-btn.update-btn{flex-shrink:0}
.nav-btn.update-btn:disabled{opacity:.75;cursor:wait}
.nav-btn.update-btn.loading .icon{display:inline-block;animation:spin .8s linear infinite}

.aid-insight{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14px;line-height:1.7;color:var(--text)}
.aid-insight.long{border-color:#3b4a63}
.aid-insight-k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.aid-insight-why{color:var(--muted);font-size:13px}
.aid-list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.aid-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.aid-head{display:grid;grid-template-columns:52px 64px 1fr;gap:12px;align-items:start}
.aid-rank{font-size:22px;font-weight:800;color:var(--accent);line-height:1.1}
.aid-score-wrap{text-align:center}
.aid-score{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.aid-score-label{font-size:10px;color:var(--dim);letter-spacing:.04em}
.aid-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.aid-title{display:block;font-size:17px;font-weight:650;line-height:1.5;color:inherit;text-decoration:none}
.aid-card.good .aid-title{color:var(--reds)}
.aid-card.bad .aid-title{color:var(--green)}
.aid-summary{margin:10px 0 0;font-size:14px;line-height:1.7;color:var(--text)}
.aid-fields{margin:10px 0 0;display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13px;line-height:1.6}
.aid-fields dt{color:var(--dim);font-weight:600}
.aid-fields dd{margin:0;color:var(--muted)}
.aid-card .news-meta a{color:var(--accent)}
@media(max-width:768px){
  .aid-head{grid-template-columns:44px 52px 1fr;gap:8px}
  .aid-title{font-size:16px}
  .aid-fields{grid-template-columns:1fr}
}

</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
